name: CI
description: Format check, vet, vulnerability check and test the Go module
inputs:
  vulncheck:
    description: "Run govulncheck. The release job turns it off so a CVE published after merge doesn't fail a release."
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        # Latest 1.26 patch, not go.mod's 1.26.0 minimum: govulncheck flags stdlib CVEs fixed in later patches.
        # Bump this when go.mod moves to a new minor version.
        go-version: '1.26.x'
        check-latest: true

    - name: Format check
      shell: bash
      run: make format-check

    - name: Vet
      shell: bash
      run: make vet

    - name: Build
      shell: bash
      run: make build

    - name: Vulnerability check
      if: inputs.vulncheck == 'true'
      shell: bash
      run: make vulncheck

    - name: Test
      shell: bash
      run: go test -race -shuffle=on ./...
