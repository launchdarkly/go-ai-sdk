name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci

  opencode-live:
    # One bridged-tool turn against the pinned OpenCode release and a local stub
    # provider: no credentials. Bump OPENCODE_VERSION and pinnedOpenCode
    # (opencodeagents/live_test.go) together.
    name: OpenCode live contract
    runs-on: ubuntu-latest
    env:
      OPENCODE_VERSION: '1.19.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Install OpenCode
        shell: bash
        run: npm install -g "opencode-ai@${OPENCODE_VERSION}" && opencode --version
      - name: Live turn
        shell: bash
        run: go test -tags opencode_live -count=1 -v -run TestLiveBridgedToolTurn ./opencodeagents/
